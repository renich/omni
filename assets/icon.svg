<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="45%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#062e24"/>
    </linearGradient>

    <!-- Ring Accent Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Omega Core Gradient -->
    <linearGradient id="omegaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Intense Core Glow Filter -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#iconBg)"/>
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="#1e293b" stroke-width="3" stroke-opacity="0.8"/>

  <!-- Radial Background Bloom -->
  <circle cx="256" cy="256" r="160" fill="#10b981" fill-opacity="0.12" filter="url(#softGlow)"/>

  <!-- Outer Lexical Orbit Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#1e293b" stroke-width="3" stroke-dasharray="10 8"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-opacity="0.5"/>

  <!-- Target Ticks (Compiler Axes) -->
  <line x1="256" y1="46" x2="256" y2="68" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="444" x2="256" y2="466" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <line x1="46" y1="256" x2="68" y2="256" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <line x1="444" y1="256" x2="466" y2="256" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>

  <!-- Inner Dark Core Plate -->
  <circle cx="256" cy="256" r="142" fill="#090e1a" stroke="#1e293b" stroke-width="3"/>
  <circle cx="256" cy="256" r="138" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Glowing Omega Vector Glyph -->
  <g filter="url(#coreGlow)" transform="translate(0, -14)">
    <path
      d="m 256,304.31641 q -4.64844,39.23828 -49.21875,39.375 -60.42969,0.13671 -60.42969,-81.34766 0,-35 26.79688,-75.46875 h 41.97265 q -17.77343,32.26562 -17.77343,74.92187 0,42.79297 19.14062,43.06641 15.72266,0.27344 15.03906,-62.20703 h 48.94532 q -0.6836,62.48047 15.03906,62.20703 19.14062,-0.27344 19.14062,-43.06641 0,-42.65625 -17.77343,-74.92187 h 41.97265 q 26.79688,40.46875 26.79688,75.46875 0,81.48437 -60.42969,81.34766 Q 260.64844,343.55469 256,304.31641 Z"
      fill="url(#omegaGrad)"
    />
  </g>
</svg>
