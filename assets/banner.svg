<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="45%" stop-color="#0c1424"/>
      <stop offset="100%" stop-color="#062e24"/>
    </linearGradient>

    <!-- Ring Accent Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Omega Core Gradient -->
    <linearGradient id="omegaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Core Glow Filter -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bannerBg)"/>
  <rect width="1196" height="316" x="2" y="2" rx="14" fill="none" stroke="#1e293b" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Subtle Speed/Wave Circuit Lines in Background -->
  <path d="M 0,220 Q 300,120 650,200 T 1200,100" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.12"/>
  <path d="M 0,260 Q 400,160 850,250 T 1200,160" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.12"/>

  <!-- Left Emblem (Scalable Omega Emblem) -->
  <g transform="translate(160, 160) scale(0.55)">
    <!-- Radial Glow Bloom -->
    <circle cx="0" cy="0" r="170" fill="#10b981" fill-opacity="0.14" filter="url(#softGlow)"/>

    <!-- Outer Orbit Ring -->
    <circle cx="0" cy="0" r="200" fill="none" stroke="#1e293b" stroke-width="3" stroke-dasharray="10 8"/>
    <circle cx="0" cy="0" r="176" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-opacity="0.6"/>

    <!-- Ticks -->
    <line x1="0" y1="-215" x2="0" y2="-190" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="190" x2="0" y2="215" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <line x1="-215" y1="0" x2="-190" y2="0" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="190" y1="0" x2="215" y2="0" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>

    <!-- Inner Core Plate -->
    <circle cx="0" cy="0" r="144" fill="#090e1a" stroke="#1e293b" stroke-width="3"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Vector Omega Glyph -->
    <g filter="url(#coreGlow)" transform="translate(-256, -270)">
      <path
        d="m 256,304.31641 q -4.64844,39.23828 -49.21875,39.375 -60.42969,0.13671 -60.42969,-81.34766 0,-35 26.79688,-75.46875 h 41.97265 q -17.77343,32.26562 -17.77343,74.92187 0,42.79297 19.14062,43.06641 15.72266,0.27344 15.03906,-62.20703 h 48.94532 q -0.6836,62.48047 15.03906,62.20703 19.14062,-0.27344 19.14062,-43.06641 0,-42.65625 -17.77343,-74.92187 h 41.97265 q 26.79688,40.46875 26.79688,75.46875 0,81.48437 -60.42969,81.34766 Q 260.64844,343.55469 256,304.31641 Z"
        fill="url(#omegaGrad)"
      />
    </g>
  </g>

  <!-- Typography and Branding Content -->
  <g transform="translate(320, 80)">
    <!-- Main Title -->
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="64" letter-spacing="-1.5px" fill="url(#textGrad)">omni</text>
    
    <!-- Subtitle / Thesis -->
    <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="20" fill="#94a3b8" letter-spacing="-0.2px">The smallest piece of code that showcases the entirety of a programming language.</text>

    <!-- Pill Badges -->
    <g transform="translate(0, 145)">
      <!-- Pill 1: 100% Saturation -->
      <g transform="translate(0, 0)">
        <rect width="185" height="34" rx="17" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
        <circle cx="17" cy="17" r="4" fill="#10b981"/>
        <text x="29" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">100% Lexical Saturation</text>
      </g>

      <!-- Pill 2: Zero Warnings -->
      <g transform="translate(200, 0)">
        <rect width="170" height="34" rx="17" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
        <circle cx="17" cy="17" r="4" fill="#38bdf8"/>
        <text x="29" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">Zero Warnings (-Werror)</text>
      </g>

      <!-- Pill 3: Single-File Ground Truth -->
      <g transform="translate(385, 0)">
        <rect width="195" height="34" rx="17" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
        <circle cx="17" cy="17" r="4" fill="#818cf8"/>
        <text x="29" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">Single-File Ground Truth</text>
      </g>

      <!-- Pill 4: Threat Modeled -->
      <g transform="translate(595, 0)">
        <rect width="180" height="34" rx="17" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
        <circle cx="17" cy="17" r="4" fill="#e11d48"/>
        <text x="29" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">Threat Modeled (CWE)</text>
      </g>
    </g>
  </g>
</svg>
